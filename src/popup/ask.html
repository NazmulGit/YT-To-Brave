<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Open YouTube link</title>
<style>
  body { margin:0; background:#0f0f0f; color:#f5f5f5; font-family:-apple-system,Segoe UI,Roboto,sans-serif; display:grid; place-items:center; min-height:100vh; }
  .card { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:18px; padding:28px; max-width:520px; width:90%; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  h1 { margin:0 0 6px; font-size:18px; }
  p.sub { margin:0 0 14px; color:#9aa0a6; font-size:12px; }
  .url { font-family:monospace; font-size:11px; background:#0c0c0c; padding:10px; border-radius:8px; word-break:break-all; border:1px solid #2a2a2a; margin-bottom:18px; }
  .btns { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  button { padding:11px; border-radius:10px; border:1px solid #2a2a2a; background:#232323; color:#fff; font-weight:600; cursor:pointer; font-size:12px; }
  button.primary { background:linear-gradient(135deg,#ff3d00,#ff0000); border-color:transparent; box-shadow:0 4px 14px rgba(255,61,0,.35); }
  button:hover { filter:brightness(1.1); }
  .footer { margin-top:14px; text-align:center; }
  .footer a { color:#9aa0a6; font-size:11px; text-decoration:none; }
  .footer a:hover { color:#fff; }
</style>
</head>
<body>
  <div class="card">
    <h1>Open this YouTube link?</h1>
    <p class="sub">YT-to-Brave is in <b>Ask</b> mode.</p>
    <div class="url" id="url"></div>
    <div class="btns">
      <button class="primary" id="brave">Open in Brave</button>
      <button id="pip">PiP here</button>
      <button id="chrome">Stay in Chrome</button>
    </div>
    <div class="footer"><a href="#" id="settings">Settings</a></div>
  </div>
<script type="module">
  const url = new URLSearchParams(location.search).get("url") || "";
  document.getElementById("url").textContent = url;
  document.getElementById("brave").onclick = async () => {
    const r = await chrome.runtime.sendMessage({ type: "OPEN_IN_BROWSER", url });
    if (r?.ok) window.close();
  };
  document.getElementById("pip").onclick = async () => {
    await chrome.runtime.sendMessage({ type: "OPEN_PIP", url });
  };
  document.getElementById("chrome").onclick = () => { location.replace(url); };
  document.getElementById("settings").onclick = (e) => {
    e.preventDefault();
    chrome.runtime.openOptionsPage();
  };
</script>
</body>
</html>
