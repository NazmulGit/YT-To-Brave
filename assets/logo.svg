<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3D00"/>
      <stop offset="100%" stop-color="#E60000"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFD9C2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="26" ry="26" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="116" height="116" rx="26" ry="26" fill="none" stroke="#ffffff22" stroke-width="1.5"/>

  <g filter="url(#softShadow)">
    <path d="M 44 36 L 86 64 L 44 92 Z" fill="url(#arrowGrad)"/>
    <path d="M 70 56 L 96 50 L 92 78 Z" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="92" cy="50" r="4" fill="#FF3D00"/>
  </g>

  <g opacity="0.85">
    <path d="M 18 22 Q 64 14 110 22" stroke="#FFFFFF33" stroke-width="2" fill="none"/>
    <path d="M 18 106 Q 64 114 110 106" stroke="#FFFFFF33" stroke-width="2" fill="none"/>
  </g>
</svg>
